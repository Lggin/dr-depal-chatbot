services:
  qdrant:
    image: qdrant/qdrant:v1.19.1  # keep in sync with qdrant-client pin in requirements.txt
    container_name: depalletizer_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL 선택사항 (초기에는 SQLite 사용)
