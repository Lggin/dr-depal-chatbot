services:
  qdrant:
    image: qdrant/qdrant:v1.19.1  # keep in sync with qdrant-client pin in requirements.txt
    container_name: depalletizer_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
    healthcheck:
      # the qdrant image ships neither curl nor wget — probe /healthz over /dev/tcp
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333; printf \"GET /healthz HTTP/1.0\\r\\n\\r\\n\" >&3; head -1 <&3 | grep -q 200'"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL 선택사항 (초기에는 SQLite 사용)
