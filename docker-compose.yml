  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chatbot}
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data

volumes:
  qdrant_storage:
