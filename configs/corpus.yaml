# Corpus sources for `scripts/ingest.py`.
#
# Each source is a markdown file or glob. Per-source fields become chunk metadata
# (document_type / trust_level per spec §4, system, tags). Paths may be absolute,
# ~-relative, or relative to the project root.
#
# Trust: official_manual 95 · official_sop 90 · official_troubleshooting 85 ·
#        maintenance_history 70 · faq 60 · engineer_note 50
# The dr-depal-knowhow docs are the team's curated, source-cited engineering
# knowledge (not vendor manuals) → treated as manual@90 / troubleshooting@85.

collection: knowhow_docs
machine: depal
manufacturer: Doosan Robotics
language: ko
alarm_codes: false          # this corpus has no VAC-203-style alarm codes; don't mine them

chunking:
  max_tokens: 800
  min_tokens: 60
  overlap_tokens: 80

sources:
  # ---- dr-depal-knowhow (auto-updated repo, Korean docs only) ----
  - path: ~/scratch_github_check/dr-depal-knowhow/docs/01-system-overview.md
    document_type: manual
    trust_level: 90
    system: architecture
  - path: ~/scratch_github_check/dr-depal-knowhow/docs/02-timeline.md
    document_type: manual
    trust_level: 90
    system: release
    tags: [release_note, history]
  - path: ~/scratch_github_check/dr-depal-knowhow/docs/03-grasp-estimation.md
    document_type: manual
    trust_level: 90
    system: geometry
  - path: ~/scratch_github_check/dr-depal-knowhow/docs/04-model-lifecycle.md
    document_type: manual
    trust_level: 90
    system: training
  - path: ~/scratch_github_check/dr-depal-knowhow/docs/05-jetson-tensorrt.md
    document_type: manual
    trust_level: 90
    system: deployment
  - path: ~/scratch_github_check/dr-depal-knowhow/docs/06-config-wiring.md
    document_type: manual
    trust_level: 90
    system: config
  - path: ~/scratch_github_check/dr-depal-knowhow/docs/07-measurement-methodology.md
    document_type: sop
    trust_level: 90
    system: methodology
  - path: ~/scratch_github_check/dr-depal-knowhow/docs/08-release-ops.md
    document_type: sop
    trust_level: 90
    system: release
  - path: ~/scratch_github_check/dr-depal-knowhow/docs/09-pitfall-catalog.md
    document_type: troubleshooting
    trust_level: 85
    system: general
  - path: ~/scratch_github_check/dr-depal-knowhow/docs/10-open-issues.md
    document_type: troubleshooting
    trust_level: 85
    system: general
    tags: [open_issues]
  - path: ~/scratch_github_check/dr-depal-knowhow/docs/11-upgrade-digest.md
    document_type: manual
    trust_level: 90
    system: release
    tags: [release_note, upgrade]
  - path: ~/scratch_github_check/dr-depal-knowhow/docs/packages/camera.md
    document_type: manual
    trust_level: 90
    system: vision
  - path: ~/scratch_github_check/dr-depal-knowhow/docs/packages/objund-pointcloud-calibration.md
    document_type: manual
    trust_level: 90
    system: vision
  - path: ~/scratch_github_check/dr-depal-knowhow/docs/packages/depal-config-logging-drift.md
    document_type: manual
    trust_level: 90
    system: runtime

  # ---- dr-onsite-adap-sdk (depal-al) operating docs ----
  - path: ~/depal-al/README.md
    document_name: dr-onsite-adap-sdk 사용설명서
