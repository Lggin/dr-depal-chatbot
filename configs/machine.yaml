# Mock machine backend (Phase 4). Real PLC/robot/vision adapters replace app/tools/mock.py
# behind the same tool interface; this file then only documents tag names.
#
# `scenario` selects which snapshot the mock tools report. Switch at runtime with
#   POST /api/admin/mock/scenario?name=<scenario>

machine_id: DP-01
scenario: vac203_low

scenarios:
  # spec §16 / §18 example
  vac203_low:
    machine_state: HOLD
    current_alarm: {code: VAC-203, severity: error, since: "2026-09-22T09:12:40"}
    vacuum_pressure: -43          # kPa (normal -60 ~ -80)
    vision_detection: true
    detected_objects: 6
    robot_state: NORMAL
    robot_pose: {x: 812.4, y: -95.2, z: 640.0, rx: 180.0, ry: 0.0, rz: 92.5, frame: base}
    camera_state: connected
    sensors: {vacuum_pressure_kpa: -43, gripper_temp_c: 31.2, supply_air_mpa: 0.55}
    plc_io: {X001_vacuum_ok: false, X002_door_closed: true, Y010_vacuum_on: true, Y011_conveyor_run: false}

  normal:
    machine_state: RUNNING
    current_alarm: null
    vacuum_pressure: -71
    vision_detection: true
    detected_objects: 8
    robot_state: NORMAL
    robot_pose: {x: 640.0, y: 120.0, z: 710.5, rx: 180.0, ry: 0.0, rz: 88.0, frame: base}
    camera_state: connected
    sensors: {vacuum_pressure_kpa: -71, gripper_temp_c: 29.8, supply_air_mpa: 0.56}
    plc_io: {X001_vacuum_ok: true, X002_door_closed: true, Y010_vacuum_on: true, Y011_conveyor_run: true}

  camera_timeout:
    machine_state: HOLD
    current_alarm: {code: VIS-301, severity: error, since: "2026-09-22T10:03:05"}
    vacuum_pressure: -72
    vision_detection: false
    detected_objects: 0
    robot_state: NORMAL
    robot_pose: {x: 500.0, y: 0.0, z: 900.0, rx: 180.0, ry: 0.0, rz: 90.0, frame: base}
    camera_state: disconnected
    sensors: {vacuum_pressure_kpa: -72, gripper_temp_c: 30.1, supply_air_mpa: 0.55}
    plc_io: {X001_vacuum_ok: true, X002_door_closed: true, Y010_vacuum_on: false, Y011_conveyor_run: false}

