# Application Configuration

app:
  name: "Depalletizer Chatbot"
  version: "0.1.0"
  environment: "development"
  debug: true
  host: "0.0.0.0"
  port: 8000
  max_workers: 4

logging:
  level: "INFO"
  format: "json"
  output: "logs/chatbot.log"

session:
  timeout_minutes: 30
  max_history: 10
  storage: "sqlite"

rag:
  embedding_model: "BAAI/bge-m3"
  embedding_dim: 1024
  reranker_model: "BAAI/bge-reranker-v2-m3"
  chunk_size: 800
  chunk_overlap: 100

retrieval:
  dense_top_k: 20
  sparse_top_k: 20
  fusion_top_k: 20
  rerank_top_k: 4
  alpha: 0.5  # 0.5 = 50% dense + 50% sparse

llm:
  model_name: "Qwen/Qwen3.5-9B"
  quantization: "q4_k_m"
  context_length: 8192
  max_tokens: 1200
  temperature: 0.2
  top_p: 0.9

qdrant:
  url: "http://localhost:6333"
  collection_name: "depalletizer_docs"
  distance_metric: "cosine"

database:
  type: "sqlite"
  path: "data/chatbot.db"

corpus:
  source_path: "corpus/raw"
  processed_path: "corpus/processed"
  glossary_path: "corpus/glossary/glossary.json"
